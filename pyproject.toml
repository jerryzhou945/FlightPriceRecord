[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "farerecord"
version = "0.2.0"
description = "航价记：携程机票价格记录、弹性行程比价与低价提醒（桌面端）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
desktop = ["pywebview>=5"]

[project.scripts]
farerecord = "farerecord.cli:main"

[tool.setuptools.packages.find]
include = ["farerecord*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web/vendor", "prototype"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
